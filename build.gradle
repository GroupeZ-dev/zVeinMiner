plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-beta11'
    id 're.alwyn974.groupez.repository' version '1.0.0'
}

group = 'fr.maxlego08.veinminer'
version = '1.0.0'

ext {
    targetFolder = file('target/')
    apiFolder = file('target-api/')
    classifier = System.getProperty('archive.classifier')
    sha = System.getProperty('github.sha')
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 're.alwyn974.groupez.repository'

    group = 'fr.maxlego08.veinminer'
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            name = 'papermc'
            url = uri('https://repo.papermc.io/repository/maven-public/')
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    shadowJar {
        archiveBaseName.set('zVeinMiner')
        archiveAppendix.set(project.path == ':' ? '' : project.name)
        archiveClassifier.set('')
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    javadoc {
        options.encoding = 'UTF-8'
        options.addBooleanOption('html5', true)
    }

    dependencies {
        compileOnly 'io.papermc.paper:paper-api:1.21.7-R0.1-SNAPSHOT'
    }
}

repositories {
    maven {
        name = 'sk89q-repo'
        url = uri('https://maven.enginehub.org/repo/')
    }
    maven {
        name = 'GriefPrevention'
        url = uri('https://jitpack.io')
    }
    maven {
        name = 'placeholderapi'
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
}

dependencies {
    api project(':API')

    // Protection plugins - WorldGuard/WorldEdit
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.3.0'

    // GriefPrevention
    compileOnly('com.github.TechFortress:GriefPrevention:16.18.2') {
        transitive = false
    }

    // Economy - Vault
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') {
        transitive = false
    }

    // PlaceholderAPI
    compileOnly 'me.clip:placeholderapi:2.11.5'
}

shadowJar {
    if (rootProject.ext.sha) {
        archiveClassifier.set("${rootProject.ext.classifier}-${rootProject.ext.sha}")
    } else {
        archiveClassifier.set(rootProject.ext.classifier)
    }
    destinationDirectory.set(rootProject.ext.targetFolder)
}

build {
    dependsOn shadowJar
}

processResources {
    from 'resources'
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}
