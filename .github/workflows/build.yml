name: Build Action

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish zVeinMiner
    uses: GroupeZ-dev/actions/.github/workflows/build.yml@main
    with:
      project-name: "zVeinMiner"
      publish: true
      project-to-publish: "API:publish"
      discord-avatar-url: "https://cdn.modrinth.com/data/OhduvhIc/f9c333a18b2c11a5fb063de8e86dba8b76094c66.png"
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
